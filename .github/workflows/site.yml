# Publishes the brand site (site/) to this repository's GitHub Pages.
#
# GitHub Pages is not available on a private repository under the Free plan, so while this repository is
# private the site is published from the public ayrshirepixels/vulnverdict-site repository instead
# (site/publish.sh copies site/ there). Once this repository is public: Settings > Pages > Source
# "GitHub Actions", then run this workflow and add the push trigger below so every site change deploys:
#
#   push:
#     branches: [main]
#     paths: ["site/**", ".github/workflows/site.yml"]
#
# The site is plain HTML with relative links, so it works under the project path
# (https://ayrshirepixels.github.io/VulnVerdict/) and, later, under its own domain unchanged.
name: Publish site

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
